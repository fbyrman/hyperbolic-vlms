[project]
name = "gvlm"
version = "0.1.0"
description = "Hyperbolic against Euclidean geometry for grounded vision-language pretraining"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.4.0+cu124; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torch==2.4.0; sys_platform == 'darwin' or (sys_platform == 'linux' and platform_machine == 'aarch64')",
    "torchvision==0.19.0+cu124; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torchvision==0.19.0; sys_platform == 'darwin' or (sys_platform == 'linux' and platform_machine == 'aarch64')",
    "ftfy>=6.0",
    "hydra-core>=1.1",
    "loguru>=0.6",
    "matplotlib>=3.10.3",
    "networkx>=3.2.1",
    "nltk>=3.6",
    "numpy==1.26.2",
    "omegaconf>=2.3.0",
    "pandas>=2.2.3",
    "pillow>=11.2.1",
    "pyarrow>=15.0",
    "pyyaml>=6.0.2",
    "regex>=2024.11.6",
    "requests>=2.32.3",
    "scipy>=1.15",
    "tensorboard>=2.20.0",
    "timm>=1.0.15",
    "torchmetrics>=1.0",
    "tqdm>=4.50.0",
    "webdataset>=0.2",
    # Both provide `tensorflow_datasets`, and the evaluation catalog reaches
    # sets whose builders exist only in the nightly.
    "tensorflow-datasets>=4.9.0",
    "tfds-nightly>=4.9.3.dev202311230044",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# Without these, a built distribution carries only the top-level modules: the
# subpackages and the BPE vocabulary are dropped, so `import gvlm.models` fails
# anywhere the source tree is not on disk.
[tool.setuptools.packages.find]
include = ["gvlm*"]

[tool.setuptools.package-data]
gvlm = ["bpe_simple_vocab_16e6.txt.gz"]

[tool.uv]
find-links = [
    "https://download.pytorch.org/whl/cu124/torch",
    "https://download.pytorch.org/whl/cu124/torchvision",
]
